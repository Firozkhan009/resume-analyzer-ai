<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .bg { fill: #f7f3eb; }
      .card { fill: #fffdf8; stroke: #d7cec0; stroke-width: 2; rx: 18; }
      .accent { fill: #173f43; }
      .accent2 { fill: #9c6644; }
      .line { stroke: #4b5563; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .title { font: 700 34px Arial, sans-serif; fill: #173f43; }
      .label { font: 700 22px Arial, sans-serif; fill: #173f43; }
      .text { font: 18px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text x="600" y="60" text-anchor="middle" class="title">Conceptual Workflow</text>

  <rect x="70" y="140" width="220" height="110" class="card"/>
  <rect x="70" y="140" width="220" height="14" class="accent"/>
  <text x="180" y="190" text-anchor="middle" class="label">Resume Upload</text>
  <text x="180" y="220" text-anchor="middle" class="text">PDF resume input</text>

  <rect x="360" y="140" width="220" height="110" class="card"/>
  <rect x="360" y="140" width="220" height="14" class="accent2"/>
  <text x="470" y="190" text-anchor="middle" class="label">Job Context</text>
  <text x="470" y="220" text-anchor="middle" class="text">Role + description</text>

  <rect x="650" y="140" width="220" height="110" class="card"/>
  <rect x="650" y="140" width="220" height="14" class="accent"/>
  <text x="760" y="190" text-anchor="middle" class="label">AI Analysis</text>
  <text x="760" y="220" text-anchor="middle" class="text">Resume evaluation</text>

  <rect x="940" y="140" width="190" height="110" class="card"/>
  <rect x="940" y="140" width="190" height="14" class="accent2"/>
  <text x="1035" y="190" text-anchor="middle" class="label">Results</text>
  <text x="1035" y="220" text-anchor="middle" class="text">Scores + tips</text>

  <path d="M290 195 H360" class="line"/>
  <path d="M580 195 H650" class="line"/>
  <path d="M870 195 H940" class="line"/>

  <rect x="180" y="390" width="220" height="100" class="card"/>
  <text x="290" y="440" text-anchor="middle" class="label">ATS Score</text>

  <rect x="490" y="390" width="220" height="100" class="card"/>
  <text x="600" y="440" text-anchor="middle" class="label">Section Feedback</text>

  <rect x="800" y="390" width="220" height="100" class="card"/>
  <text x="910" y="440" text-anchor="middle" class="label">Suggestions</text>

  <path d="M1035 250 V330 H290 V390" class="line"/>
  <path d="M1035 250 V330 H600 V390" class="line"/>
  <path d="M1035 250 V330 H910 V390" class="line"/>

  <text x="600" y="610" text-anchor="middle" class="text">
    Upload resume -> match with target job -> run AI analysis -> return feedback
  </text>
</svg>
