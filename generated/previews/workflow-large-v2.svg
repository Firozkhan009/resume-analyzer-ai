<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600">
  <defs>
    <style>
      .bg { fill: #f6f1e8; }
      .title { font: 700 54px Arial, sans-serif; fill: #102f33; }
      .step { font: 700 34px Arial, sans-serif; fill: #102f33; }
      .sub { font: 24px Arial, sans-serif; fill: #243746; }
      .card { fill: #fffdfa; stroke: #cfc5b7; stroke-width: 4; rx: 26; }
      .teal { fill: #173f43; }
      .brown { fill: #9c6644; }
      .green { fill: #5d7f63; }
      .arrow { stroke: #435160; stroke-width: 10; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto">
      <path d="M0,0 L0,10 L12,5 z" fill="#435160"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="1600"/>
  <text x="700" y="92" text-anchor="middle" class="title">Conceptual Workflow</text>

  <rect x="270" y="150" width="860" height="180" class="card"/>
  <rect x="270" y="150" width="860" height="22" class="teal"/>
  <text x="700" y="236" text-anchor="middle" class="step">1. Upload Resume</text>
  <text x="700" y="286" text-anchor="middle" class="sub">User submits a PDF resume</text>

  <path d="M700 330 V415" class="arrow"/>

  <rect x="270" y="430" width="860" height="200" class="card"/>
  <rect x="270" y="430" width="860" height="22" class="brown"/>
  <text x="700" y="516" text-anchor="middle" class="step">2. Add Job Details</text>
  <text x="700" y="566" text-anchor="middle" class="sub">Company name, job title,</text>
  <text x="700" y="602" text-anchor="middle" class="sub">and job description</text>

  <path d="M700 630 V715" class="arrow"/>

  <rect x="270" y="730" width="860" height="210" class="card"/>
  <rect x="270" y="730" width="860" height="22" class="green"/>
  <text x="700" y="818" text-anchor="middle" class="step">3. AI Analysis</text>
  <text x="700" y="870" text-anchor="middle" class="sub">System compares the resume</text>
  <text x="700" y="906" text-anchor="middle" class="sub">with the target job</text>

  <path d="M700 940 V1025" class="arrow"/>

  <rect x="90" y="1045" width="260" height="170" class="card"/>
  <rect x="90" y="1045" width="260" height="20" class="teal"/>
  <text x="220" y="1128" text-anchor="middle" class="step" font-size="30">ATS Score</text>
  <text x="220" y="1170" text-anchor="middle" class="sub">format and keyword fit</text>

  <rect x="390" y="1045" width="260" height="170" class="card"/>
  <rect x="390" y="1045" width="260" height="20" class="brown"/>
  <text x="520" y="1128" text-anchor="middle" class="step" font-size="30">Content</text>
  <text x="520" y="1170" text-anchor="middle" class="sub">impact and relevance</text>

  <rect x="740" y="1045" width="260" height="170" class="card"/>
  <rect x="740" y="1045" width="260" height="20" class="green"/>
  <text x="870" y="1128" text-anchor="middle" class="step" font-size="30">Structure</text>
  <text x="870" y="1170" text-anchor="middle" class="sub">organization and clarity</text>

  <rect x="1050" y="1045" width="260" height="170" class="card"/>
  <rect x="1050" y="1045" width="260" height="20" class="teal"/>
  <text x="1180" y="1128" text-anchor="middle" class="step" font-size="30">Suggestions</text>
  <text x="1180" y="1170" text-anchor="middle" class="sub">actionable improvements</text>

  <path d="M700 1025 V1045 H220" class="arrow"/>
  <path d="M700 1025 V1045 H520" class="arrow"/>
  <path d="M700 1025 V1045 H870" class="arrow"/>
  <path d="M700 1025 V1045 H1180" class="arrow"/>
</svg>
